<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Register</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input
                type="text"
                name="name"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">

            <label>Role</label>

            <select
                name="role"
                class="form-control"
                required
            >
                <option value="User">Trekker</option>
                <option value="Trek Staff">Trek Staff</option>
            </select>

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Register
        </button>

        <a
            href="{{ url_for('login') }}"
            class="btn btn-secondary"
        >
            Login
        </a>

    </form>

</div>

</body>
</html>
