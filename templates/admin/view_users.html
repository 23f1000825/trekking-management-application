<!DOCTYPE html>
<html>

<head>

<title>Manage Users</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Manage Users</h2>

<table class="table table-bordered">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Blacklisted</th>
<th>Actions</th>

</tr>

{% for user in users %}

<tr>

<td>{{ user.user_id }}</td>
<td>{{ user.name }}</td>
<td>{{ user.email }}</td>
<td>{{ user.is_blacklisted }}</td>

<td>

<a
href="{{ url_for('blacklist_user', user_id=user.user_id) }}"
class="btn btn-danger btn-sm">

Blacklist

</a>

<a
href="{{ url_for('activate_user', user_id=user.user_id) }}"
class="btn btn-success btn-sm">

Activate

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
