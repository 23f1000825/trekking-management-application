<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Login</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-success"
        >
            Login
        </button>

        <a
            href="{{ url_for('register') }}"
            class="btn btn-secondary"
        >
            Register
        </a>

    </form>

</div>

</body>
</html>
