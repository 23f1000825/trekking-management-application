<!DOCTYPE html>
<html>

<head>

<title>Update Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Update Profile</h2>

<hr>

<form method="POST">

<div class="mb-3">

<label>Contact Number</label>

<input
type="text"
name="contact_number"
class="form-control"
value="{{ profile.contact_number or '' }}"
required>

</div>

<div class="mb-3">

<label>Experience (Years)</label>

<input
type="number"
name="experience"
class="form-control"
value="{{ profile.experience or '' }}"
required>

</div>

<button
class="btn btn-success">

Update

</button>

</form>

</div>

</body>

</html>
