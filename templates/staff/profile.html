{% extends "base_dashboard.html" %}

{% block title %}
My Profile
{% endblock %}

{% block panel_title %}
Staff Panel
{% endblock %}

{% block sidebar %}

<div class="list-group list-group-flush">

    <a href="{{ url_for('staff_dashboard') }}"
       class="list-group-item list-group-item-action">
        Dashboard
    </a>

    <a href="{{ url_for('staff_profile') }}"
       class="list-group-item list-group-item-action active">
        Profile
    </a>

    <a href="{{ url_for('logout') }}"
       class="list-group-item list-group-item-action text-danger">
        Logout
    </a>

</div>

{% endblock %}

{% block content %}

<h2 class="mb-4">
    Update Profile
</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">
    Contact Number
</label>

<input
type="text"
name="contact_number"
class="form-control"
value="{{ profile.contact_number or '' }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
    Experience (Years)
</label>

<input
type="number"
name="experience"
class="form-control"
value="{{ profile.experience or '' }}"
min="0"
required>

</div>

</div>

<button
type="submit"
class="btn btn-success">

Update Profile

</button>

<a
href="{{ url_for('staff_dashboard') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

{% endblock %}
