<!DOCTYPE html>
<html>

<head>

<title>User Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Update Profile</h2>

<hr>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ user.name }}"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ user.email }}"
required>

</div>

<button
class="btn btn-success">

Update

</button>

</form>

</div>

</body>

</html>
